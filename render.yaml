services:
  - type: web
    name: bibliotech
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run seed && gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bibliotech-db
          property: connectionString

databases:
  - name: bibliotech-db
    plan: free
    databaseName: bibliotech
